<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>圣诞贺卡 · 30 秒一张</title>
<!--
  可点原型 v0.8 · 2026-11-22
    - 「🎴 更换卡片」点击即生效：模板与祝福立刻变换，首页大图同步刷新（抽卡弹层仅做结果展示）
    - 祝福语自写输入框移到首页「🖼️ 做成贺卡」按钮上方
  v0.7 音乐默认播放·素材库只预览 / v0.6 抽卡 / v0.5 收到祝福界面 / v0.3 素材库化 / v0.2 一键分享
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f4f1ec; color:#2b2118;
    max-width:480px; margin:0 auto; min-height:100vh;
    padding-bottom:40px;
  }
  header { padding:20px 20px 8px; }
  header h1 { font-size:22px; font-weight:800; }
  header p { font-size:13px; color:#8a7f72; margin-top:4px; }
  .steps { display:flex; gap:6px; padding:10px 20px 0; flex-wrap:wrap; }
  .steps span { font-size:11px; padding:3px 10px; border-radius:99px; background:#e8e2d8; color:#8a7f72; }
  .steps span.on { background:#b3282d; color:#fff; font-weight:600; }
  section { padding:14px 20px 0; }
  section h2 { font-size:15px; font-weight:700; margin-bottom:10px; }
  section h2 em { font-style:normal; font-size:12px; color:#8a7f72; font-weight:400; margin-left:6px; }
  /* 音乐 */
  .music { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .music .label { font-size:12px; color:#8a7f72; margin-right:2px; }
  .song {
    padding:8px 14px; border-radius:99px; background:#fff; font-size:13px;
    border:1.5px solid #e0d8cb; color:#5a4f42; cursor:pointer;
  }
  .song.sel { background:#2e4a9e; border-color:#2e4a9e; color:#fff; font-weight:600; }
  .song.playing { animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  /* 模板卡片：6 张真图，两行三列 */
  .tpls { display:flex; flex-wrap:wrap; gap:10px; }
  .tpl {
    width:calc((100% - 20px)/3); border-radius:14px; overflow:hidden;
    border:2.5px solid transparent; cursor:pointer; position:relative;
    transition:transform .15s; background:#e8e2d8;
  }
  .tpl:active { transform:scale(.96); }
  .tpl img { width:100%; height:105px; object-fit:cover; display:block; }
  .tpl .name { background:#fff; text-align:center; font-size:12px; padding:6px 0; }
  .tpl.sel { border-color:#b3282d; }
  .tpl.sel::after {
    content:"✓"; position:absolute; top:6px; right:6px; width:20px; height:20px;
    background:#b3282d; color:#fff; border-radius:50%; font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  /* 祝福语 */
  .words { display:flex; flex-wrap:wrap; gap:8px; }
  .word {
    padding:9px 14px; border-radius:99px; background:#fff; font-size:13px;
    border:1.5px solid #e0d8cb; color:#5a4f42; cursor:pointer; transition:all .15s;
  }
  .word.sel { background:#b3282d; border-color:#b3282d; color:#fff; font-weight:600; }
  .word.scene { border-color:#d4a017; background:#fff7e0; color:#8a6d1f; }
  .word.scene.sel { background:#d4a017; border-color:#d4a017; color:#fff; }
  .scene-tag { width:100%; font-size:11px; color:#a3852b; margin-bottom:-4px; }
  /* 自定义输入 */
  .custom { display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  .custom input {
    flex:1; min-width:180px; padding:10px 14px; border-radius:12px; border:1.5px solid #e0d8cb;
    font-size:13px; color:#2b2118; background:#fff; outline:none;
  }
  .custom input:focus { border-color:#b3282d; }
  .custom .use {
    padding:10px 14px; border-radius:12px; border:none; font-size:13px; font-weight:600;
    background:#5a4f42; color:#fff; cursor:pointer; flex-shrink:0;
  }
  .custom .hintx { font-size:11px; color:#b5aa9a; width:100%; }
  /* 生成按钮（素材库折叠区内） */
  .gen {
    width:100%; padding:15px; border:none; border-radius:14px;
    background:#b3282d; color:#fff; font-size:16px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 14px rgba(179,40,45,.35);
  }
  .gen:active { transform:scale(.98); }
  /* 结果弹层 */
  .mask {
    position:fixed; inset:0; background:rgba(20,14,8,.72);
    display:none; align-items:center; justify-content:center; z-index:10; padding:24px;
  }
  .mask.show { display:flex; }
  .result { background:#fff; border-radius:18px; width:100%; max-width:360px; padding:16px; max-height:92vh; overflow-y:auto; }
  .result img { width:100%; border-radius:10px; display:block; }
  .hint { font-size:13px; color:#5a4f42; line-height:1.7; margin:12px 0 4px; }
  .hint b { color:#b3282d; }
  .hint small { display:block; color:#8a7f72; font-size:11px; margin-top:4px; }
  .row { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .btn { flex:1; padding:12px; border-radius:12px; border:none; font-size:14px; font-weight:600; cursor:pointer; min-width:120px; }
  .btn-redo { background:#efe9df; color:#5a4f42; }
  .btn-save { background:#b3282d; color:#fff; }
  .btn-share { background:#2e7d32; color:#fff; }
  footer { text-align:center; font-size:11px; color:#b5aa9a; padding:26px 20px 0; line-height:1.7; }
  /* 「收到了一个祝福」hero 区 */
  .received { text-align:center; font-size:12px; color:#8a7f72; padding-top:22px; letter-spacing:3px; }
  .hero { padding:0 20px; text-align:center; }
  .ver { font-size:13px; color:#6f93c4; letter-spacing:6px; margin-top:14px; }
  .hero h1 { font-size:30px; font-weight:800; color:#2b2118; margin-top:8px; letter-spacing:2px; }
  .greet { font-size:14px; color:#5a4f42; margin-top:12px; line-height:1.7; padding:0 12px; }
  .hero-img {
    margin:20px auto 0; max-width:320px; border-radius:18px; overflow:hidden;
    box-shadow:0 10px 28px rgba(43,33,24,.20); background:#e8e2d8; cursor:pointer;
  }
  .hero-img img { width:100%; display:block; }
  .tap-hint { font-size:12px; color:#b5aa9a; margin-top:14px; }
  .hero-btns { display:flex; gap:10px; margin-top:16px; }
  .h-main {
    flex:1.6; padding:14px; border:none; border-radius:99px;
    background:#6f93c4; color:#fff; font-size:16px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 14px rgba(111,147,196,.4);
  }
  .h-main:active { transform:scale(.97); }
  .h-sub {
    flex:1; padding:14px; border:1.5px solid #d5cfc3; border-radius:99px;
    background:#fff; color:#5a4f42; font-size:14px; cursor:pointer;
  }
  .h-mini {
    margin-top:10px; width:100%; padding:12px; border:1.5px solid #b3282d;
    border-radius:99px; background:#fff; color:#b3282d;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  /* 抽卡结果层 */
  .pity { font-size:11px; color:#b5aa9a; margin-top:8px; }
  .gacha {
    position:fixed; inset:0; background:rgba(14,10,6,.92); z-index:20;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .gacha.show { display:flex; }
  .gacha-box { width:100%; max-width:400px; text-align:center; }
  .g-pop { opacity:0; transform:scale(.6); transition:all .5s cubic-bezier(.2,1.4,.4,1); }
  .gacha.reveal .g-pop { opacity:1; transform:scale(1); }
  .g-title2 { color:#f5c342; font-size:14px; font-weight:700; letter-spacing:2px; margin-bottom:12px; }
  .g-stars { font-size:24px; letter-spacing:8px; }
  .g-wrap .g-stars, .g-cellstars, .g-cell.r3 .g-stars { color:#6f93c4; }
  .r4 .g-stars, .g-cell.r4 .g-cellstars { color:#9b59d0; }
  .r5 .g-stars, .g-cell.r5 .g-cellstars { color:#f5c342; }
  .g-img {
    width:100%; max-width:300px; border-radius:16px; display:block; margin:14px auto 0;
  }
  .g-wrap.r3 .g-img { box-shadow:0 0 24px rgba(111,147,196,.5); border:2px solid #6f93c4; }
  .g-wrap.r4 .g-img { box-shadow:0 0 34px rgba(155,89,208,.55); border:2px solid #9b59d0; }
  .g-wrap.r5 .g-img { box-shadow:0 0 44px rgba(245,195,66,.6); border:2px solid #f5c342; }
  .g-name { color:#fff; font-size:20px; font-weight:800; margin-top:14px; }
  .g-word { color:#ffe9c0; font-size:14px; margin-top:8px; line-height:1.7; padding:0 10px; }
  .g-new {
    display:inline-block; background:#b3282d; color:#fff; font-size:11px;
    padding:2px 8px; border-radius:99px; margin-left:8px; vertical-align:middle;
  }
  .g-btns { display:flex; gap:8px; margin-top:18px; justify-content:center; }
  .g-btns button { padding:11px 16px; border-radius:99px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
  .g-again { background:#6f93c4; color:#fff; }
  .g-skip  { background:#efe9df; color:#5a4f42; }
  .g-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .g-cell {
    width:calc((100% - 16px)/3); position:relative; border-radius:10px;
    overflow:hidden; background:#241d14; cursor:pointer; padding-bottom:4px;
  }
  .g-cell img { width:100%; height:72px; object-fit:cover; display:block; }
  .g-cellname { font-size:10px; color:#fff; padding-top:3px; }
  .g-cellstars { font-size:9px; letter-spacing:1px; }
  .g-cell.r3 { border:1.5px solid #6f93c4; }
  .g-cell.r4 { border:1.5px solid #9b59d0; }
  .g-cell.r5 { border:1.5px solid #f5c342; }
  .g-cell .g-new { position:absolute; top:4px; left:4px; margin:0; }
  .lib-row { display:flex; align-items:center; justify-content:flex-start; margin-top:18px; }
  .lib-toggle { background:none; border:none; color:#b5aa9a; font-size:11px; cursor:pointer; padding:6px 0; }
  .lib-toggle:hover { color:#8a7f72; }
  .reroll {
    background:#efe9df; border:none; border-radius:99px; padding:7px 14px;
    font-size:12px; color:#5a4f42; cursor:pointer;
  }
  .reroll:active { transform:scale(.96); }
  #builder h2 { margin-top:22px; }
  #builder .gen { margin-top:16px; }
  .tpl-preview { margin-top:12px; text-align:center; }
  .tpl-preview img {
    max-width:220px; border-radius:14px; display:block; margin:0 auto;
    box-shadow:0 6px 18px rgba(43,33,24,.18);
  }
  .tpl-preview .tpname { font-size:12px; color:#8a7f72; margin-top:8px; line-height:1.7; }
</style>
</head>
<body>

<p class="received">收到了一个祝福 · 冬日限定</p>

<div class="hero">
  <p class="ver" id="verTag"></p>
  <h1 id="cardTitle"></h1>
  <p class="greet" id="greetLine"></p>
  <div class="hero-img" id="heroImg">
    <img id="heroCard" alt="当前贺卡插画">
  </div>
  <p class="tap-hint">圣诞音乐已默认开启，点按钮可关 🔔</p>
  <div class="hero-btns">
    <button class="h-main" id="musicBtn" onclick="toggleMusic()">🎵 圣诞音乐 · 开</button>
    <button class="h-sub" onclick="wish()">🎴 更换卡片</button>
  </div>
  <p class="pity" id="pityTip"></p>
  <div class="custom">
    <input id="myword" maxlength="40" placeholder="想自己写一句祝福？写在这里（可选）">
    <button class="use" onclick="useCustom()">用这句</button>
  </div>
  <button class="h-mini" onclick="generate()">🖼️ 做成贺卡，保存 / 分享</button>
  <div class="lib-row">
    <button class="lib-toggle" onclick="toggleLib('builder', this)">📚 素材库 ▾</button>
  </div>
</div>

<section id="builder" style="display:none">
  <h2>选个模板 <em>点击只做预览，不会改动当前卡片；换卡请用「更换卡片」</em></h2>
  <div class="tpls" id="tpls"></div>
  <div class="tpl-preview" id="tplPreview"></div>
  <h2>选句祝福 <em>都是现成的，点一句就换成这句</em></h2>
  <div class="words" id="words"></div>
  <button class="gen" onclick="generate()">用这套做贺卡 →</button>
</section>

<div class="mask" id="mask" onclick="if(event.target===this) closeMask()">
  <div class="result">
    <img id="out" alt="生成的贺卡">
    <p class="hint" id="hint"></p>
    <div class="row">
      <button class="btn btn-share" id="shareBtn" onclick="shareImg()">📱 直接分享</button>
      <button class="btn btn-redo" onclick="closeMask()">再做一张</button>
      <button class="btn btn-save" onclick="saveTip()">怎么发朋友？</button>
    </div>
  </div>
</div>

<div class="gacha" id="gacha" onclick="if(event.target===this) closeGacha()">
  <div class="gacha-box" id="gachaBox"></div>
</div>

<footer>
  v0.8.1 可点原型 · 2026-11-22（修复：初始化顺序致「更换卡片」失效）<br>
  全程零上传 · 零账号 ｜ 音乐为现场合成，保存的图片不含音频
</footer>

<script src="library.js"></script>
<script>
/* ============ 状态（随机抽取） ============ */
function randPick(n){ return Math.floor(Math.random() * n); }
var TPL = TPL_LIBRARY[randPick(TPL_LIBRARY.length)].id;
var word = 0;
var customText = null;   // 用户自写祝福（null = 未用）

/* ============ 模板图预加载（清单来自素材库） ============ */
var IMGS = {};
TPL_LIBRARY.forEach(function(t){
  var im = new Image(); im.src = t.src; IMGS[t.id] = im;
});

/* ============ 音乐（WebAudio 现场合成，零外部资源） ============ */
var NOTES = {"C4":261.63,"D4":293.66,"E4":329.63,"F4":349.23,"G4":392.00,"A4":440.00,"B4":493.88,
             "C5":523.25,"D5":587.33,"E5":659.25,"F5":698.46,"G5":783.99};
var SONGS = {
  bell: { bpm:150, seq:[["E5",1],["E5",1],["E5",2],["E5",1],["E5",1],["E5",2],
          ["E5",1],["G5",1],["C5",1.5],["D5",0.5],["E5",4],
          ["F5",1],["F5",1],["F5",1.5],["F5",0.5],
          ["F5",1],["E5",1],["E5",1],["E5",0.5],["E5",0.5],
          ["E5",1],["D5",1],["D5",1],["E5",1],["D5",2],["G5",2]] },
  silent: { bpm:92, seq:[["G4",1],["A4",1],["G4",2],["E4",4],
          ["G4",1],["A4",1],["G4",2],["E4",4],
          ["C5",2],["B4",2],["A4",2],["G4",2],
          ["A4",1],["G4",1],["E4",2],["A4",2],["G4",2],["E4",2],
          ["D4",2],["E4",2],["C4",4]] }
};
var ac = null, musicTimer = null;
function stopMusic(){
  if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
  if (ac) { try { ac.close(); } catch(e){} ac = null; }
}
function tone(freq, at, dur){
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.11, at + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(at); o.stop(at + dur + 0.1);
}
function playMusic(key){
  stopMusic();
  ac = new (window.AudioContext || window.webkitAudioContext)();
  var s = SONGS[key], beat = 60 / s.bpm, t = ac.currentTime + 0.05;
  s.seq.forEach(function(n){ tone(NOTES[n[0]], t, n[1]*beat*0.92); t += n[1]*beat; });
  musicTimer = setTimeout(function(){ playMusic(key); }, (t - ac.currentTime + 0.6) * 1000);
}
/* 圣诞音乐：默认《铃儿响叮当》且默认开启。
   浏览器禁止无手势出声——加载时先尝试播放，
   被拦则等首次点击/触摸自动续上 */
var songKey = "bell";
var musicOn = true;
var musicBtn = document.getElementById("musicBtn");
function startMusicNow(){
  stopMusic();
  try { playMusic(songKey); } catch(e){}
}
function toggleMusic(){
  musicOn = !musicOn;
  if (musicOn){ startMusicNow(); if (musicBtn) musicBtn.textContent = "🎵 圣诞音乐 · 开"; }
  else { stopMusic(); if (musicBtn) musicBtn.textContent = "🎵 圣诞音乐 · 关"; }
}
startMusicNow();   // 尝试默认播放（无手势时会被浏览器拦下）
var _musicResumed = false;
function resumeMusicOnce(){
  if (_musicResumed || !musicOn) return;
  _musicResumed = true;
  startMusicNow();
}
document.addEventListener("touchstart", resumeMusicOnce, {passive:true});
document.addEventListener("click", resumeMusicOnce);

/* ============ 祝福语：场景句（按日期）+ 通用预设 ============ */
var YEAR = new Date().getFullYear();
function sceneGreeting(){
  var d = new Date(), m = d.getMonth()+1, day = d.getDate();
  if (m===12 && day===24) return { tag:"✨ 今天是平安夜，这句最应景", text:"记得吃苹果，圣诞快乐，祝你来年好运 🍎🎁" };
  if (m===12 && day===25) return { tag:"✨ 今天就是圣诞节", text:"圣诞快乐！愿今天全是好消息 🎄" };
  if (m===12 && day>=20) return { tag:"✨ 圣诞倒计时 " + (25-day) + " 天", text:"先把快乐备好，圣诞快乐 🎄✨" };
  if (m===1 && day===1)  return { tag:"✨ 今天是元旦", text:"新年快乐，圣诞的愿望接着实现 🎆" };
  return null;
}
var GREETING_LIBRARY = GREETING_LIBRARY || [];  // 素材库（library.js）

function renderWords(){
  var box = document.getElementById("words");
  box.innerHTML = "";
  var scene = sceneGreeting();
  if (scene){
    var tag = document.createElement("div");
    tag.className = "scene-tag"; tag.textContent = scene.tag;
    box.appendChild(tag);
    addWord(box, scene.text, true);
  }
  GREETING_LIBRARY.forEach(function(w){ addWord(box, w.t, false); });
  if (customText) addWord(box, "✏️ " + customText, false);
  /* 随机抽一句（含场景句与自定义） */
  var chips = [].slice.call(box.querySelectorAll(".word"));
  word = randPick(chips.length);
  chips[word].classList.add("sel");
  renderHero();
}
/* hero 区随当前模板与祝福同步刷新 */
function renderHero(){
  var t = themeOf(TPL);
  document.getElementById("verTag").textContent = t.ver + " · 冬日限定";
  document.getElementById("cardTitle").textContent = "冬日限定" + t.name;
  document.getElementById("heroCard").src = t.src;
  var chips = [].slice.call(document.querySelectorAll("#words .word"));
  var line = chips[word] ? chips[word].textContent : GREETING_LIBRARY[0].t;
  document.getElementById("greetLine").textContent = line.replace(/^✏️ /, "");
}
function addWord(box, text, isScene){
  var b = document.createElement("div");
  b.className = "word" + (isScene ? " scene" : "");
  b.textContent = text;
  b.onclick = function(){
    [].forEach.call(box.querySelectorAll(".word"), function(c){ c.classList.remove("sel"); });
    b.classList.add("sel");
    var all = [].slice.call(box.querySelectorAll(".word"));
    word = all.indexOf(b);
    renderHero();
  };
  box.appendChild(b);
}
function useCustom(){
  var v = document.getElementById("myword").value.trim();
  if (!v) return;
  customText = v;
  renderWords();
  var all = [].slice.call(document.querySelectorAll("#words .word"));
  word = all.length - 1;
  all[word].classList.add("sel");
  renderHero();
}

/* ============ 模板（随机展示 + 素材库折叠自选） ============ */
function renderTpls(){
  var box = document.getElementById("tpls");
  box.innerHTML = "";
  TPL_LIBRARY.forEach(function(t){
    var d = document.createElement("div");
    d.className = "tpl" + (t.id === TPL ? " sel" : "");
    d.dataset.t = t.id;
    d.innerHTML = '<img src="' + t.src + '" alt=""><div class="name">' + t.name + '</div>';
    d.onclick = function(){ pickTpl(d); };
    box.appendChild(d);
  });
  renderHero();
}
function rerollTpl(){
  var pool = TPL_LIBRARY.filter(function(t){ return t.id !== TPL; });
  TPL = pool[randPick(pool.length)].id;
  renderHero();
}

/* ============ 祈愿（原神式抽卡） ============ */
/* 模板池与祝福池共享一套保底：每 10 抽必出 4★+，每 30 抽必出 5★；
   基础概率 5★ 6% / 4★ 15% / 3★ 79%。抽卡记录与保底进度存 localStorage */
var GK = { c:0, p4:0, p5:0, got:{} };
try {
  var _gk = JSON.parse(localStorage.getItem("xmasGacha") || "null");
  if (_gk && typeof _gk.c === "number") GK = _gk;
} catch(e){}
function saveGK(){ try { localStorage.setItem("xmasGacha", JSON.stringify(GK)); } catch(e){} }

function rollRarity(){
  GK.c++; GK.p4++; GK.p5++;
  var r;
  if (GK.p5 >= 30)      r = 5;
  else if (GK.p4 >= 10) r = Math.random() < 0.08 ? 5 : 4;
  else {
    var x = Math.random();
    r = x < 0.06 ? 5 : (x < 0.21 ? 4 : 3);
  }
  if (r >= 4) GK.p4 = 0;
  if (r === 5) GK.p5 = 0;
  saveGK();
  return r;
}
function drawFrom(pool, r){
  var cand = pool.filter(function(x){ return x.r === r; });
  return cand[randPick(cand.length)];
}
function renderPity(){
  var el = document.getElementById("pityTip");
  if (el) el.textContent =
    "已祈愿 " + GK.c + " 次 ｜ " + (10 - GK.p4) + " 抽内必出 4★+ · " + (30 - GK.p5) + " 抽内必出 5★";
}

var lastPulls = [];
function wish(){
  var r = rollRarity();
  var t = drawFrom(TPL_LIBRARY, r);
  /* 避免连续两次抽到同一模板：同星级内换一个 */
  if (t.id === TPL){
    var alt = TPL_LIBRARY.filter(function(x){ return x.r === r && x.id !== TPL; });
    if (alt.length) t = alt[randPick(alt.length)];
  }
  var w = drawFrom(GREETING_LIBRARY, r);
  var isNew = !GK.got["t"+t.id];
  GK.got["t"+t.id] = 1;
  saveGK();
  /* 立即生效：首页大图（预览）与祝福同步变换，弹层只做结果展示 */
  applyPair(t.id, w.t);
  showGacha([{ tpl:t, word:w, r:r, isNew:isNew }]);
  renderPity();
}
function starHTML(r){
  var s = ""; for (var i=0;i<r;i++) s += "★"; return s;
}
function showGacha(pulls){
  lastPulls = pulls;
  var p = pulls[0];
  document.getElementById("gachaBox").innerHTML =
    '<div class="g-pop g-wrap r'+p.r+'">' +
      '<div class="g-stars">'+starHTML(p.r)+'</div>' +
      '<img class="g-img" src="'+p.tpl.src+'">' +
      '<div class="g-name">'+p.tpl.name+(p.isNew?'<span class="g-new">NEW</span>':'')+'</div>' +
      '<div class="g-word">'+p.word.t+'</div>' +
    '</div>' +
    '<div class="g-btns">' +
      '<button class="g-again" onclick="wish()">🎴 再换一张</button>' +
      '<button class="g-skip" onclick="closeGacha()">知道了</button>' +
    '</div>';
  var g = document.getElementById("gacha");
  g.classList.remove("reveal");
  g.classList.add("show");
  setTimeout(function(){ g.classList.add("reveal"); }, 60);
}
function applyPair(tplId, wordText){
  TPL = tplId;
  var chips = [].slice.call(document.querySelectorAll("#words .word"));
  word = 0;
  for (var i=0;i<chips.length;i++){
    if (chips[i].textContent === wordText || chips[i].textContent === "✏️ " + wordText){ word = i; break; }
  }
  chips.forEach(function(c,i){ c.classList.toggle("sel", i===word); });
  renderHero();
}
function closeGacha(){
  var g = document.getElementById("gacha");
  g.classList.remove("show");
  g.classList.remove("reveal");
}
function toggleLib(id, btn){
  var el = document.getElementById(id);
  var opening = el.style.display === "none";
  el.style.display = opening ? "" : "none";
  btn.textContent = opening ? "📚 收起素材库 ▴" : "📚 素材库 ▾";
}
/* 素材库模板点击 = 仅预览，不改当前卡片；换卡只走「更换卡片」 */
function previewTpl(el){
  var t = themeOf(el.dataset.t);
  document.getElementById("tplPreview").innerHTML =
    '<img src="' + t.src + '" alt="">' +
    '<div class="tpname">「' + t.name + '」· 素材库预览（不影响当前卡片）<br>想换卡请回首页点「🎴 更换卡片」</div>';
}
function pickTpl(el){
  previewTpl(el);
}

/* ============ canvas 合成：750×1000，真图模板 ============ */
/* 每款模板的文字配色与遮罩存在素材库条目里，按图微调 */
function themeOf(id){
  for (var i=0;i<TPL_LIBRARY.length;i++){
    if (TPL_LIBRARY[i].id === id) return TPL_LIBRARY[i];
  }
  return TPL_LIBRARY[0];
}

function renderCard(tpl, text){
  var c = document.createElement("canvas");
  c.width = 750; c.height = 1000;
  var g = c.getContext("2d");
  var theme = themeOf(tpl);

  /* 真图背景：cover 裁剪铺满（图源 750×1125，居中裁到 750×1000） */
  var im = IMGS[tpl];
  if (im && im.complete && im.naturalWidth){
    var dh = 750 * im.naturalHeight / im.naturalWidth;
    g.drawImage(im, 0, (1000 - dh) / 2, 750, dh);
  } else {
    var gr = g.createLinearGradient(0,0,0,1000);
    gr.addColorStop(0,"#16244f"); gr.addColorStop(1,"#31549f");
    g.fillStyle = gr; g.fillRect(0,0,750,1000);
  }

  /* 顶部彩灯串 */
  var bulbs = ["#ff5a5a","#ffd166","#7be382","#6fb7ff"];
  g.strokeStyle = "rgba(255,255,255,.30)"; g.lineWidth = 3;
  g.beginPath();
  for (var x=0; x<=750; x+=50){
    var midY = 92 + ((x/50)%2)*18;
    g.quadraticCurveTo(x+25, midY+14, x+50, 92);
  }
  g.stroke();
  for (var i=0; i<15; i++){
    var bx = 38 + i*48, by = 104 + (i%2)*16;
    g.fillStyle = "rgba(255,220,150,.28)";
    g.beginPath(); g.arc(bx, by, 16, 0, 7); g.fill();
    g.fillStyle = bulbs[i%4];
    g.beginPath(); g.arc(bx, by, 8, 0, 7); g.fill();
  }

  /* 飘雪点缀 */
  var pts = [[60,190,22],[190,160,14],[330,200,18],[470,160,14],[610,200,20],[690,170,12]];
  pts.forEach(function(p,i){
    g.globalAlpha = 0.5 + (i%3)*0.15;
    g.font = p[2] + "px serif"; g.textAlign = "center";
    g.fillText("❄", p[0], p[1]);
  });
  g.globalAlpha = 1;

  /* 文字区遮罩：保证在插画上仍可读 */
  var sc = g.createLinearGradient(0,430,0,1000);
  sc.addColorStop(0, theme.scrim[0]); sc.addColorStop(1, theme.scrim[1]);
  g.fillStyle = sc; g.fillRect(0,430,750,570);

  /* 标签 */
  g.font = "600 26px sans-serif"; g.textAlign = "center";
  g.fillStyle = "rgba(255,255,255,.85)";
  g.fillText(theme.tag, 375, 500);

  /* 主标题（立体阴影） */
  g.save();
  g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 8; g.shadowOffsetY = 4;
  g.font = "800 92px 'Kaiti SC','STKaiti','KaiTi',serif";
  g.fillStyle = theme.title;
  g.fillText("圣诞快乐", 375, 610);
  g.restore();

  /* 祝福语：金色楷体 + 阴影 + 花式分隔线 */
  var lines = wrap(g, text, "600 34px 'Kaiti SC','STKaiti','KaiTi',serif", 560);
  var LH = 54, blockH = lines.length * LH;
  var top = 740 - blockH/2 + 40;

  g.font = "30px serif"; g.fillStyle = "rgba(255,215,130,.9)";
  g.fillText("❄ ─── ✦ ─── ❄", 375, top - 46);

  g.save();
  g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 10; g.shadowOffsetY = 2;
  g.font = "600 34px 'Kaiti SC','STKaiti','KaiTi',serif";
  g.fillStyle = theme.sub;
  lines.forEach(function(l,i){ g.fillText(l, 375, top + i*LH); });
  g.restore();

  g.font = "30px serif"; g.fillStyle = "rgba(255,215,130,.9)";
  g.fillText("❄ ─── ✦ ─── ❄", 375, top + blockH + 40);

  /* 落款：年份自适应 */
  g.font = "22px sans-serif"; g.fillStyle = "rgba(255,255,255,.72)";
  g.fillText("来自一位朋友的圣诞贺卡 · " + YEAR, 375, 952);
  return c.toDataURL("image/png");
}

function wrap(g, text, font, max){
  g.font = font;
  var lines = [], cur = "";
  for (var i=0;i<text.length;i++){
    if (g.measureText(cur + text[i]).width > max){ lines.push(cur); cur = text[i]; }
    else cur += text[i];
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ============ 生成 / 分享 / 弹层 ============ */
var lastDataUrl = null;
function generate(){
  var text;
  var all = [].slice.call(document.querySelectorAll("#words .word"));
  if (customText && all[word] && all[word].textContent.indexOf("✏️") === 0) text = customText;
  else text = all[word] ? all[word].textContent : GREETING_LIBRARY[0];
  if (text.indexOf("✏️ ") === 0) text = text.slice(2);
  lastDataUrl = renderCard(TPL, text);
  document.getElementById("out").src = lastDataUrl;
  setHint();
  document.getElementById("mask").classList.add("show");
}
function setHint(){
  var hint = document.getElementById("hint");
  var shareBtn = document.getElementById("shareBtn");
  var canShare = false;
  try {
    var f = dataUrlToFile(lastDataUrl);
    canShare = !!(navigator.canShare && navigator.canShare({files:[f]}));
  } catch(e){}
  shareBtn.style.display = canShare ? "" : "none";
  if (isWeChat()){
    hint.innerHTML = "<b>长按图片</b>保存到相册，然后在微信里<b>直接把图发给朋友</b>——贺卡本身就是内容，比发链接好使得多。" +
      "<small>微信里网页暂不支持一键转发卡片；「点一下直接发给微信好友」是正式小程序版的头号功能。</small>";
  } else if (canShare){
    hint.innerHTML = "点上方 <b>📱 直接分享</b> 可调起系统分享（微信/QQ/短信都行）；或 <b>长按图片</b> 保存到相册再发。";
  } else {
    hint.innerHTML = "<b>长按图片</b>保存到相册，再从相册把图发给朋友。";
  }
}
function isWeChat(){ return /MicroMessenger/i.test(navigator.userAgent); }
function dataUrlToFile(dataUrl){
  var arr = atob(dataUrl.split(",")[1]), n = arr.length, u8 = new Uint8Array(n);
  for (var i=0;i<n;i++) u8[i] = arr.charCodeAt(i);
  return new File([u8], "christmas-card.png", {type:"image/png"});
}
function shareImg(){
  if (!lastDataUrl) return;
  try {
    var f = dataUrlToFile(lastDataUrl);
    if (navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({ files:[f], title:"圣诞贺卡", text:"给你做了一张圣诞贺卡 🎄" });
      return;
    }
  } catch(e){}
  saveTip();
}
function closeMask(){ document.getElementById("mask").classList.remove("show"); }
function saveTip(){
  if (isWeChat()){
    alert("微信里：长按图片 → 保存图片（iPhone 叫存入相册）\n然后回到聊天，点「+」→ 相册，把这张图发出去。\n收到的人点开就能看，不用点任何链接。");
  } else {
    alert("长按图片 → 保存图片 / 存入相册\n然后在微信或 QQ 里点「+」→ 相册，把这张图发出去即可。");
  }
}

/* ============ 初始化（必须放在最后：依赖上方全部函数与状态） ============ */
renderWords();
renderTpls();
renderPity();
</script>
